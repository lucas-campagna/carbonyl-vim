name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build libcarbonyl (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: libcarbonyl.so
          - os: macos-13
            target: x86_64-apple-darwin
            lib: libcarbonyl.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            lib: libcarbonyl.dylib

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" dist/
          cd dist
          zip -r "../libcarbonyl-${{ matrix.target }}.zip" .

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "libcarbonyl-${{ matrix.target }}.zip" --clobber
